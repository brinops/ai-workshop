# docker compose up --build    → http://localhost:8000
# Requires in .env: GITHUB_TOKEN, SLACK_WEBHOOK_URL and ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN.
services:
  control-plane:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      CORS_ORIGINS: '["http://localhost:8000"]'
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - rcp-data:/data
    stop_grace_period: 40s   # lets the worker stop agents and release leases
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  rcp-data:

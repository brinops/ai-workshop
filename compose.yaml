# docker compose up --build    → http://127.0.0.1:${PORT:-8000}
# Requires in .env: GITHUB_TOKEN, SLACK_WEBHOOK_URL and ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN.
# RCP_BIND=0.0.0.0 exposes the dashboard on the LAN — it has no login, so only on trusted networks.
# RCP_DATA=./var reuses the local SQLite history instead of the named volume.
services:
  control-plane:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}   # pass from the shell, e.g. GITHUB_TOKEN=$(gh auth token)
      CORS_ORIGINS: '["http://localhost:8000"]'
    ports:
      - "${RCP_BIND:-127.0.0.1}:${PORT:-8000}:8000"
    volumes:
      - ${RCP_DATA:-rcp-data}:/data
    stop_grace_period: 40s   # lets the worker stop agents and release leases
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  rcp-data:

# CI Control Plane — which repositories are watched and who handles which failure.
#
# Domain knowledge lives in the standard .claude/ layout:
#   .claude/skills/<analysis_skill>/SKILL.md      Analysis Skill (+ scripts/ such as the validator)
#   .claude/agents/<remediation_agent>.md         Remediation Subagent
# This file only wires them together. A route is chosen by the name of the *failed CI check*
# (deterministic — never by asking the model), and its allowed_paths are enforced by the backend
# on the produced diff, whatever the agent claims.
#
# Secrets do not belong here: tokens and the Slack webhook stay in .env.

repositories:
  - repo: brinops/ai-workshop
    protected_branches: [main, master, "release/*", production]
    routes:
      - check: helm-validate                     # check-run name in GitHub Actions
        analysis_skill: k8s-failure-analysis
        remediation_agent: k8s-remediator
        validator: .claude/skills/k8s-failure-analysis/scripts/validate.py
        allowed_paths: ["demo/charts/**"]
        max_changed_lines: 40
        max_attempts: 2

# Adding a domain, e.g. Terraform:
#   1. .claude/skills/terraform-failure-analysis/SKILL.md + scripts/validate.py
#      (prints `RCP-FINDING {json}` lines with a category, exit 1 on findings)
#   2. .claude/agents/terraform-remediator.md

name: CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "tools/**"
      - ".claude/hooks/**"
      - ".github/workflows/ci.yaml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        working-directory: backend
        run: uv run --python 3.12 ruff check app tests ../.claude/hooks ../tools ../demo/scripts ../scripts
      - name: Test
        working-directory: backend
        run: uv run --python 3.12 pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm lint && pnpm test && pnpm build
